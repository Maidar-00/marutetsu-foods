<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理画面 | マルテツフーズ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%237A6240'/%3E%3Ctext x='50' y='66' font-size='48' text-anchor='middle' fill='white' font-family='serif'%3E丸%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <!-- ======================= LOGIN ======================= -->
  <div id="login-view" class="login-view" hidden>
    <div class="login-card">
      <div class="login-logo">
        <span class="mark">丸</span>
        <div>
          <div class="ja">マルテツフーズ</div>
          <div class="en">ADMIN</div>
        </div>
      </div>
      <h1>管理画面</h1>
      <p class="login-sub">ログインしてください</p>
      <form id="login-form">
        <label>ユーザー名
          <input type="text" id="login-username" autocomplete="username" required>
        </label>
        <label>パスワード
          <input type="password" id="login-password" autocomplete="current-password" required>
        </label>
        <div class="login-error" id="login-error"></div>
        <button type="submit" class="btn-primary">ログイン</button>
      </form>
      <div class="login-hint" id="login-hint" hidden>
        初期ログイン情報：<b>admin</b> / <b>marutetsu123</b><br>
        <small>（「設定」から変更してください）</small>
      </div>
      <a class="login-back" href="/">← サイトに戻る</a>
    </div>
  </div>

  <!-- ======================= DASHBOARD ======================= -->
  <div id="admin-view" class="admin-view" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="mark">丸</span>
        <span>マルテツフーズ<br><small>ADMIN</small></span>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-foot">
        <button class="link-btn" id="view-site">🌐 サイトを見る</button>
        <button class="link-btn" id="logout-btn">↩ ログアウト</button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <button class="burger" id="burger">☰</button>
        <h2 id="section-title">設定</h2>
        <span class="save-state" id="save-state"></span>
      </div>
      <div class="admin-content" id="admin-content"></div>
    </main>

    <div class="save-bar" id="save-bar">
      <span>未保存の変更があります</span>
      <button class="btn-primary" id="save-btn">💾 保存する</button>
    </div>
  </div>

  <!-- image library modal -->
  <div class="modal-backdrop" id="library-modal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3>画像ライブラリ</h3>
        <button class="modal-close" data-close>✕</button>
      </div>
      <div class="modal-body">
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="upload-input" accept="image/*" multiple hidden>
          <p>📁 クリックして画像を選択、またはここにドラッグ＆ドロップ</p>
          <button class="btn-secondary" id="upload-btn">画像をアップロード</button>
        </div>
        <div class="upload-progress" id="upload-progress" hidden>アップロード中...</div>
        <div class="library-grid" id="library-grid"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/admin.js"></script>
</body>
</html>
