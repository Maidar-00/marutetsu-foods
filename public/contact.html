<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ | マルテツフーズ株式会社</title>
  <meta name="description" content="ご相談・ご連絡はこちらからお気軽にどうぞ。マルテツフーズ株式会社へのお問い合わせ。">
  <link rel="icon" type="image/png" href="/images/favicon-m.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="contact">
  <header class="site-header" id="site-header"></header>

  <div id="page-hero"></div>

  <section class="section" id="contact-body"></section>

  <footer class="site-footer" id="site-footer"></footer>

  <!-- Netlify Forms: the visible form is built by JS at runtime, so this
       static hidden copy (same name + fields) registers the form with
       Netlify's parser at deploy time. Do not remove. -->
  <form name="inquiry" data-netlify="true" netlify-honeypot="inquiry-hp" hidden>
    <input type="text" name="name">
    <input type="text" name="company">
    <input type="email" name="email">
    <input type="tel" name="tel">
    <select name="category">
      <option value="製品について">製品について</option>
      <option value="卸・お取引について">卸・お取引について</option>
      <option value="採用について">採用について</option>
      <option value="その他">その他</option>
    </select>
    <textarea name="message"></textarea>
  </form>

  <script src="/js/site.js"></script>
</body>
</html>
